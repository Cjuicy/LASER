version: 2

input:
  image_dir: tests/fixtures/images
  sample_stride: 1

output:
  scene_name: pipeline_test
  cache_dir: .pytest_cache/laser/cache
  result_dir: .pytest_cache/laser/results
  save_diagnostics: true

model:
  name: pi3
  checkpoint: weights/model.safetensors
  inference_device: cuda
  process_device: cpu
  dtype: bfloat16

prediction_cache:
  root: inference_cache/predictions
  mode: auto

window:
  size: 10
  overlap: 5

segmentation:
  method: atomic
  confidence_keep_ratio: 0.5
  confidence_quantile_method: higher
  depth_merge_threshold: 0.1
  temporal_iou_threshold: 0.3

  felzenszwalb:
    scale: 300
    sigma: 1.1
    min_size: 500

  geometry:
    normal_method: cross
    normal_threshold_degrees: 20.0

  atomic:
    split_mode: conservative
    split_score_threshold: 0.10

  window_reference:
    enabled: false
    sampling_stride: 4
    max_keyframes: 4
    relative_depth_tolerance: 0.05
    min_reference_score: 0.30
    stop_coverage_ratio: 0.90
    min_coverage_gain: 0.03
    min_region_correspondences: 8
    min_region_coverage: 0.10
    min_region_purity: 0.80
    merge_vote_threshold: 0.80

anchor_propagation:
  enabled: true
  correspondence_iou_threshold: 0.4

registration:
  confidence_keep_ratio: 0.30

reconstruction:
  mode: corrected

loop:
  detection:
    method: salad
    salad_checkpoint: weights/dino_salad.ckpt
    dino_checkpoint: weights/dinov2_vitb14_pretrain.pth
    image_size: [336, 336]
    batch_size: 32
    similarity_threshold: 0.7
    top_k: 5
    nms_enabled: true
    nms_frame_radius: 25

  constraint:
    chunk_size: 20

  optimizer:
    implementation: cpp
    use_sim3: true
    max_iterations: 30
    initial_damping: 1.0e-6
