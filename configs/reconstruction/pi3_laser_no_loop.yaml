version: 2

input:
  image_dir: data/00/image_2
  sample_stride: 1

output:
  scene_name: kitti_00_no_loop
  cache_dir: inference_cache/kitti_00_no_loop
  result_dir: outputs/reconstruction
  save_diagnostics: true

model:
  name: pi3
  checkpoint: weights/model.safetensors
  inference_device: cuda
  process_device: cpu
  dtype: bfloat16

prediction_cache:
  root: inference_cache/predictions
  mode: auto

window:
  size: 20
  overlap: 5

segmentation:
  method: depth
  confidence_keep_ratio: 0.5
  confidence_quantile_method: higher
  depth_merge_threshold: 0.1
  temporal_iou_threshold: 0.3
  felzenszwalb:
    scale: 300
    sigma: 1.1
    min_size: 500
  geometry:
    normal_method: cross
    normal_threshold_degrees: 20.0
  atomic:
    split_mode: conservative
    split_score_threshold: 0.10
  window_reference:
    enabled: false
    sampling_stride: 4
    max_keyframes: 4
    relative_depth_tolerance: 0.05
    min_reference_score: 0.30
    stop_coverage_ratio: 0.90
    min_coverage_gain: 0.03
    min_region_correspondences: 8
    min_region_coverage: 0.10
    min_region_purity: 0.80
    merge_vote_threshold: 0.80

anchor_propagation:
  enabled: true
  correspondence_iou_threshold: 0.4

registration:
  confidence_keep_ratio: 0.5

reconstruction:
  mode: no_loop
